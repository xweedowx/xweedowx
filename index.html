<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Punto de Venta</title>
  
  <!-- Configuración PWA e iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Punto de Venta" />
  <meta name="theme-color" content="#E8E3D6" />
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 0; background-color: #E8E3D6; color: #2D3748; -webkit-tap-highlight-color: transparent; }
    .pos-root { display: flex; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; background: #F7F5F0; }
    .pos-header { padding: 16px; background: #2D3748; color: #FFF; display: flex; justify-content: space-between; align-items: center; }
    .pos-header-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
    .pos-header-title { font-size: 18px; margin: 4px 0 0 0; font-weight: 700; }
    .pos-main { flex: 1; overflow-y: auto; padding: 12px; }
    .pos-nav { display: flex; background: #FFF; border-top: 1px solid #E2E8F0; padding-bottom: env(safe-area-inset-bottom); }
    .pos-nav-btn { flex: 1; border: none; background: none; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #718096; cursor: pointer; }
    .pos-nav-btn.active { color: #2B6CB0; font-weight: bold; }
    .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .chip { border: 1px solid #CBD5E0; background: #FFF; border-radius: 20px; padding: 6px 14px; font-size: 12px; white-space: nowrap; cursor: pointer; display: flex; align-items: center; }
    .chip-active { background: #2B6CB0; color: #FFF; border-color: #2B6CB0; }
    .search-row { position: relative; margin-bottom: 12px; }
    .search-input { width: 100%; padding: 10px 10px 10px 36px; border-radius: 8px; border: 1px solid #CBD5E0; font-size: 14px; outline: none; }
    .search-icon { position: absolute; left: 10px; top: 10px; color: #A0AEC0; }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .product-card { background: #FFF; border: 1px solid #E2E8F0; border-radius: 8px; padding: 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-height: 90px; }
    .product-card:disabled { opacity: 0.5; }
    .product-card-name { font-size: 13px; font-weight: 600; line-height: 1.2; margin-bottom: 6px; }
    .product-card-price { font-size: 15px; font-weight: 700; color: #2B6CB0; }
    .product-card-stock { font-size: 11px; color: #718096; margin-top: 4px; }
    .product-card-stock.out { color: #E53E3E; font-weight: bold; }
    .pos-toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #2D3748; color: #FFF; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 99; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .empty-state { text-align: center; padding: 40px 16px; color: #718096; font-size: 14px; }
    .cart-bar { position: sticky; bottom: 0; background: #2B6CB0; color: white; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; cursor: pointer; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; z-index: 100; }
    .modal-card { background: #FFF; width: 100%; max-height: 85vh; border-radius: 16px 16px 0 0; padding: 20px; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #EDF2F7; }
    .btn-qty { border: 1px solid #CBD5E0; background: #FFF; border-radius: 4px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .btn-primary { width: 100%; background: #2B6CB0; color: #FFF; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; margin-top: 12px; cursor: pointer; }
    .icon-btn { background: none; border: none; color: inherit; cursor: pointer; }
    .Styles-dummy { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const LucideIcons = window['lucide-react'] || {};

    const IconWrapper = ({ name, size = 18, className = "", strokeWidth = 2, ...props }) => {
      const Component = LucideIcons[name];
      if (Component) return <Component size={size} className={className} strokeWidth={strokeWidth} {...props} />;
      return <span className={className} style={{ display: 'inline-block', width: size, height: size }}>•</span>;
    };

    // Colección de Iconos
    const ShoppingCart = (p) => <IconWrapper name="ShoppingCart" {...p} />;
    const Package = (p) => <IconWrapper name="Package" {...p} />;
    const Users = (p) => <IconWrapper name="Users" {...p} />;
    const Wallet = (p) => <IconWrapper name="Wallet" {...p} />;
    const BarChart3 = (p) => <IconWrapper name="BarChart3" {...p} />;
    const Plus = (p) => <IconWrapper name="Plus" {...p} />;
    const Minus = (p) => <IconWrapper name="Minus" {...p} />;
    const Trash2 = (p) => <IconWrapper name="Trash2" {...p} />;
    const X = (p) => <IconWrapper name="X" {...p} />;
    const Search = (p) => <IconWrapper name="Search" {...p} />;
    const Settings = (p) => <IconWrapper name="Settings" {...p} />;
    const Check = (p) => <IconWrapper name="Check" {...p} />;
    const Layers = (p) => <IconWrapper name="Layers" {...p} />;
    const Tag = (p) => <IconWrapper name="Tag" {...p} />;
    const Store = (p) => <IconWrapper name="Store" {...p} />;
    const User = (p) => <IconWrapper name="User" {...p} />;
    const Phone = (p) => <IconWrapper name="Phone" {...p} />;
    const Mail = (p) => <IconWrapper name="Mail" {...p} />;
    const FileText = (p) => <IconWrapper name="FileText" {...p} />;

    const KEYS = { products: "pos-products", customers: "pos-customers", cajas: "pos-cajas", cuts: "pos-cortes", sales: "pos-sales", settings: "pos-settings" };

    async function loadKey(key, fallback) {
      try {
        const res = localStorage.getItem(key);
        return res ? JSON.parse(res) : fallback;
      } catch (e) { return fallback; }
    }
    async function saveKey(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
    }

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const money = (n) => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(n || 0);

    const SEED_PRODUCTS = [
      { id: uid(), name: "Pepsi 3 Lts / 8pza", category: "Pepsi y Sabores", price: 324, stock: 20, sku: "PEP-3L" },
      { id: uid(), name: "Pepsi 1.5 Lts / 12pza", category: "Pepsi y Sabores", price: 298, stock: 20, sku: "PEP-1.5L" },
      { id: uid(), name: "Coca 3 Lts / 8pza", category: "Coca y Sabores", price: 376, stock: 20, sku: "COC-3L" },
      { id: uid(), name: "Coca 600 ml / 24pza", category: "Coca y Sabores", price: 450, stock: 20, sku: "COC-600" },
      { id: uid(), name: "Electrolit Surtido 625 ml / 12pza", category: "Electrolitos", price: 246, stock: 20, sku: "ELE-SUR" },
      { id: uid(), name: "Volt Azul / 15pza", category: "Energéticos", price: 235, stock: 20, sku: "VLT-AZU" },
      { id: uid(), name: "Modelo Charola", category: "Cerveza Corona", price: 400, stock: 20, sku: "MOD-CHA" },
      { id: uid(), name: "Tecate Charola", category: "Cerveza Superior/Tecate", price: 325, stock: 20, sku: "TEC-CHA" },
      { id: uid(), name: "Charrito Litro", category: "Tequilas y Licor", price: 235, stock: 20, sku: "CHA-1L" },
    ];

    const SEED_CAJAS = [{ id: uid(), name: "Caja Principal" }];
    const Styles = () => <div className="Styles-dummy"></div>;

    function App() {
      const [ready, setReady] = useState(false);
      const [tab, setTab] = useState("ventas");
      const [products, setProducts] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [cajas, setCajas] = useState([]);
      const [cuts, setCuts] = useState([]);
      const [sales, setSales] = useState([]);
      const [settings, setSettings] = useState({ storeName: "Supply Comitán", activeCajaId: null });
      const [showSettings, setShowSettings] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        (async () => {
          const [p, c, cj, ct, sa, se] = await Promise.all([
            loadKey(KEYS.products, null),
            loadKey(KEYS.customers, []),
            loadKey(KEYS.cajas, null),
            loadKey(KEYS.cuts, []),
            loadKey(KEYS.sales, []),
            loadKey(KEYS.settings, { storeName: "Supply Comitán", activeCajaId: null }),
          ]);
          setProducts(p === null ? SEED_PRODUCTS : p);
          if (p === null) saveKey(KEYS.products, SEED_PRODUCTS);
          setCustomers(c);
          setCajas(cj === null ? SEED_CAJAS : cj);
          if (cj === null) saveKey(KEYS.cajas, SEED_CAJAS);
          setCuts(ct);
          setSales(sa);
          setSettings(se);
          setReady(true);
        })();
      }, []);

      function notify(msg) {
        setToast(msg);
        window.clearTimeout(notify._t);
        notify._t = window.setTimeout(() => setToast(null), 2200);
      }

      async function persistProducts(next) { setProducts(next); await saveKey(KEYS.products, next); }
      async function persistCustomers(next) { setCustomers(next); await saveKey(KEYS.customers, next); }
      async function persistCajas(next) { setCajas(next); await saveKey(KEYS.cajas, next); }
      async function persistCuts(next) { setCuts(next); await saveKey(KEYS.cuts, next); }
      async function persistSales(next) { setSales(next); await saveKey(KEYS.sales, next); }
      async function persistSettings(next) { setSettings(next); await saveKey(KEYS.settings, next); }

      const activeCajaId = useMemo(() => settings.activeCajaId || cajas[0]?.id || null, [settings.activeCajaId, cajas]);

      function completeSale(sale) {
        const nextSales = [sale, ...sales];
        persistSales(nextSales);
        const nextProducts = products.map((p) => {
          const line = sale.items.find((i) => i.productId === p.id);
          return line ? { ...p, stock: Math.max(0, p.stock - line.qty) } : p;
        });
        persistProducts(nextProducts);
        notify("Venta procesada con éxito");
      }

      const tabs = [
        { id: "ventas", label: "Ventas", icon: ShoppingCart },
        { id: "inventario", label: "Inventario", icon: Package },
        { id: "clientes", label: "Clientes", icon: Users },
        { id: "cajas", label: "Cajas", icon: Wallet },
        { id: "reportes", label: "Reportes", icon: BarChart3 },
      ];

      return (
        <div className="pos-root">
          <Styles />
          <header className="pos-header">
            <div>
              <div className="pos-header-eyebrow"><Store size={12} style={{ display: 'inline', marginRight: 4 }} /> Punto de Venta</div>
              <h1 className="pos-header-title">{settings.storeName}</h1>
            </div>
            <button className="icon-btn" onClick={() => setShowSettings(true)}><Settings size={20} /></button>
          </header>

          <main className="pos-main">
            {!ready ? (
              <div className="empty-state">Cargando base de datos…</div>
            ) : tab === "ventas" ? (
              <SalesTab products={products} customers={customers} cajas={cajas} activeCajaId={activeCajaId} onChangeCaja={(id) => persistSettings({...settings, activeCajaId: id})} onSale={completeSale} />
            ) : tab === "inventario" ? (
              <InventoryTab products={products} setProducts={persistProducts} notify={notify} />
            ) : tab === "clientes" ? (
              <ContactsTab data={customers} setData={persistCustomers} notify={notify} />
            ) : tab === "cajas" ? (
              <CajasTab cajas={cajas} setCajas={persistCajas} sales={sales} cuts={cuts} setCuts={persistCuts} notify={notify} />
            ) : (
              <ReportsTab sales={sales} />
            )}
          </main>

          <nav className="pos-nav">
            {tabs.map((t) => {
              const Icon = t.icon;
              const active = tab === t.id;
              return (
                <button key={t.id} className={"pos-nav-btn" + (active ? " active" : "")} onClick={() => setTab(t.id)}>
                  <Icon size={20} strokeWidth={active ? 2.4 : 1.8} />
                  <span>{t.label}</span>
                </button>
              );
            })}
          </nav>

          {toast && <div className="pos-toast">{toast}</div>}
        </div>
      );
    }

    function SalesTab({ products, customers, cajas, activeCajaId, onChangeCaja, onSale }) {
      const [query, setQuery] = useState("");
      const [category, setCategory] = useState("Todas");
      const [cart, setCart] = useState([]);
      const [showCart, setShowCart] = useState(false);

      const categories = useMemo(() => ["Todas", ...Array.from(new Set(products.map((p) => p.category || "General")))], [products]);
      const filtered = products.filter((p) => (category === "Todas" || p.category === category) && p.name.toLowerCase().includes(query.toLowerCase()));

      function addToCart(product) {
        if (product.stock <= 0) return;
        setCart((prev) => {
          const existing = prev.find((i) => i.productId === product.id);
          if (existing) {
            if (existing.qty >= product.stock) return prev;
            return prev.map((i) => (i.productId === product.id ? { ...i, qty: i.qty + 1 } : i));
          }
          return [...prev, { productId: product.id, name: product.name, price: product.price, qty: 1 }];
        });
      }

      function changeQty(productId, delta) {
        setCart((prev) => prev.map((i) => i.productId === productId ? { ...i, qty: i.qty + delta } : i).filter((i) => i.qty > 0));
      }

      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);

      function handleCheckout() {
        if (cart.length === 0) return;
        onSale({ id: uid(), date: new Date().toISOString(), items: cart, total, cajaId: activeCajaId });
        setCart([]);
        setShowCart(false);
      }

      return (
        <div>
          <div className="search-row">
            <Search size={16} className="search-icon" />
            <input className="search-input" placeholder="Buscar producto..." value={query} onChange={(e) => setQuery(e.target.value)} />
          </div>

          <div className="chip-row">
            {categories.map((c) => (
              <button key={c} className={"chip" + (c === category ? " chip-active" : "")} onClick={() => setCategory(c)}>
                <Tag size={13} style={{ marginRight: 4 }} />{c}
              </button>
            ))}
          </div>

          <div className="product-grid">
            {filtered.map((p) => (
              <button key={p.id} className="product-card" onClick={() => addToCart(p)} disabled={p.stock <= 0}>
                <div className="product-card-name">{p.name}</div>
                <div>
                  <div className="product-card-price">{money(p.price)}</div>
                  <div className={"product-card-stock" + (p.stock <= 0 ? " out" : "")}>
                    <Layers size={10} style={{ marginRight: 2 }} />
                    {p.stock <= 0 ? "Agotado" : `${p.stock} disp.`}
                  </div>
                </div>
              </button>
            ))}
          </div>

          {cart.length > 0 && (
            <div className="cart-bar" onClick={() => setShowCart(true)}>
              <span>🛒 {cartCount} artículos</span>
              <span>Cobrar {money(total)}</span>
            </div>
          )}

          {showCart && (
            <div className="modal-overlay" onClick={() => setShowCart(false)}>
              <div className="modal-card" onClick={(e) => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 16 }}>
                  <h3 style={{ margin: 0 }}>Carrito de Compras</h3>
                  <button className="icon-btn" onClick={() => setShowCart(false)}><X size={20} /></button>
                </div>
                {cart.map((item) => (
                  <div key={item.productId} className="cart-item">
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{item.name}</div>
                      <div style={{ fontSize: 12, color: '#718096' }}>{money(item.price)} c/u</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <button className="btn-qty" onClick={() => changeQty(item.productId, -1)}>-</button>
                      <span>{item.qty}</span>
                      <button className="btn-qty" onClick={() => changeQty(item.productId, 1)}>+</button>
                    </div>
                  </div>
                ))}
                <button className="btn-primary" onClick={handleCheckout}>Finalizar Venta ({money(total)})</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function InventoryTab({ products }) {
      return (
        <div>
          <h3 style={{ marginTop: 0 }}>Inventario de Productos</h3>
          {products.map(p => (
            <div key={p.id} className="cart-item">
              <div>
                <div style={{ fontWeight: 600 }}>{p.name}</div>
                <div style={{ fontSize: 12, color: '#718096' }}>{p.category} | SKU: {p.sku}</div>
              </div>
              <div style={{ fontWeight: 'bold' }}>{p.stock} pzas</div>
            </div>
          ))}
        </div>
      );
    }

    function ContactsTab() { return <div className="empty-state">Módulo de Clientes listo para guardar contactos.</div>; }
    function CajasTab() { return <div className="empty-state">Caja activada y lista para recibir cobros.</div>; }
    function ReportsTab({ sales }) {
      const totalVentas = sales.reduce((acc, s) => acc + s.total, 0);
      return (
        <div style={{ textAlign: 'center', padding: 20 }}>
          <h3>Resumen de Ventas</h3>
          <div style={{ fontSize: 32, fontWeight: 'bold', color: '#2B6CB0', margin: '20px 0' }}>{money(totalVentas)}</div>
          <p>{sales.length} transacciones registradas</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
